# USB gamepad: EVOFOX / ShanWan "Android GamePad" (2563:0526), raw joy_node indices,
# measured on the robot 2026-11-20:
#   axes:    0 left stick X (left = -1)   1 left stick Y (up = +1)
#            2 right stick X (left = -1)  3 right stick Y   4, 5 triggers (stuck at 1.0, unused)
#   buttons: 6 LB  7 RB
# Hold LB to drive (deadman) or RB to drive faster (turbo); let go and the robot stops.
# Left stick up/down = forward/back, right stick left/right = turn.
# The pad reads 1.0 on every axis until a stick is first moved; joy_guard.py (/joy_raw ->
# /joy) holds those axes at 0 so the robot can't take off on its own.
# Check the numbers with `ros2 topic echo /joy` (or the Drive page) if a pad maps differently.
joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.08
    autorepeat_rate: 20.0
    sticky_buttons: false

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.25
    scale_linear_turbo:
      x: 0.45

    # right stick X; negative scale because this pad reports left as -1 (ROS: left = +yaw)
    axis_angular:
      yaw: 2
    scale_angular:
      yaw: -0.9
    scale_angular_turbo:
      yaw: -1.5

    enable_button: 6
    enable_turbo_button: 7

    require_enable_button: true
