# USB gamepad (e.g. EVOFOX in X-input mode, Linux xpad driver; raw joy_node indices):
#   axes:    0 left stick X (left = +1)  1 left stick Y (up = +1)  3 right stick X  4 right stick Y
#   buttons: 0 A  1 B  2 X  3 Y  4 LB  5 RB  6 Back  7 Start  8 Home  9 L-stick  10 R-stick
# Hold LB to drive (deadman) or RB to drive faster (turbo); let go and the robot stops. Left stick: up/down = drive, left/right = turn.
# Check the numbers with `ros2 topic echo /joy` (or the Drive page) if a pad maps differently.
joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.08
    autorepeat_rate: 20.0
    sticky_buttons: false

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.25
    scale_linear_turbo:
      x: 0.45

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.9
    scale_angular_turbo:
      yaw: 1.5

    enable_button: 4
    enable_turbo_button: 5

    require_enable_button: true
