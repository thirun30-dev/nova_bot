# twist_mux >= 4.5 (Jazzy) only handles geometry_msgs/TwistStamped, in and out.
# The plain-Twist sources (/cmd_vel from Nav2/keyboard, /cmd_vel_joy from the
# gamepad) are stamped by twist_stamper nodes in the launch files first.
#
# Priority (higher wins):  e_stop lock 255 > gamepad 100 > web dashboard 50
#                          > tracker 20 > Nav2/keyboard 10
twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : cmd_vel_stamped
        timeout : 0.5
        priority: 10
      tracker:
        topic   : cmd_vel_tracker   # must be TwistStamped
        timeout : 0.5
        priority: 20
      dashboard:
        topic   : cmd_vel_dashboard # TwistStamped, from hiro_dashboard teleop
        timeout : 0.5
        priority: 50
      joystick:
        topic   : cmd_vel_joy_stamped
        timeout : 0.5
        priority: 100
    locks:
      e_stop:
        topic   : e_stop            # std_msgs/Bool, true = every velocity source blocked
        timeout : 0.0
        priority: 255
